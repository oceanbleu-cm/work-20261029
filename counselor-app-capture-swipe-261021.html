<meta charset="utf-8">
<title>상담사 앱 — 실 캡처 스와이프 — 운세당</title>
<style>
  :root {
    --ink: #14161c;
    --sub: #5b5d68;
    --paper: #f4f5f9;
    --card: #ffffff;
    --line: #e1e3ea;
    --live: #2f4bdb;
    --live-soft: #eaedfb;
    --locked: #b5790a;
    --locked-soft: #fbf0db;
    --neutral: #5b5d68;
    --neutral-soft: #ebecf1;
  }

  * { box-sizing: border-box }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }

  body {
    margin: 0;
    padding: 36px 18px 64px;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .mono {
    font-family: ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  }

  .wrap { max-width: 980px; margin: 0 auto }

  /* ── header ───────────────────────────────────────────── */
  .page-head { max-width: 560px; margin-bottom: 32px }

  .eyebrow {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .12em;
    color: var(--live);
    background: var(--live-soft);
    border-radius: 999px;
    padding: 4px 11px;
    margin-bottom: 14px;
  }

  h1 {
    font-size: 27px;
    font-weight: 800;
    letter-spacing: -.015em;
    margin: 0 0 10px;
  }

  .lede {
    font-size: 14.5px;
    color: var(--sub);
    margin: 0;
  }

  /* ── console grid ─────────────────────────────────────── */
  .console {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
  }

  @media (min-width: 900px) {
    .console {
      grid-template-columns: 182px 1fr 268px;
      align-items: start;
    }
  }

  /* ── rail (stage nav) ─────────────────────────────────── */
  .rail {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 2px;
  }

  @media (min-width: 900px) {
    .rail {
      flex-direction: column;
      overflow-x: visible;
      position: sticky;
      top: 28px;
    }
  }

  .rail-item {
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    font: inherit;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--sub);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 11px;
    padding: 9px 12px;
    cursor: pointer;
    text-align: left;
    white-space: nowrap;
  }

  @media (min-width: 900px) {
    .rail-item { white-space: normal }
  }

  .rail-item .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex: none;
    background: var(--line);
  }

  .rail-item .range {
    margin-left: auto;
    font-size: 10px;
    color: var(--sub);
    opacity: .7;
  }

  .rail-item.active {
    color: var(--ink);
    border-color: currentColor;
  }

  .rail-item.active[data-state="live"] { border-color: var(--live); background: var(--live-soft) }
  .rail-item.active[data-state="locked"] { border-color: var(--locked); background: var(--locked-soft) }
  .rail-item.active[data-state="neutral"] { border-color: var(--neutral); background: var(--neutral-soft) }

  .rail-item[data-state="live"] .dot { background: var(--live) }
  .rail-item[data-state="locked"] .dot { background: var(--locked) }
  .rail-item[data-state="neutral"] .dot { background: var(--neutral) }

  .rail-item:focus-visible, button:focus-visible {
    outline: 2px solid var(--live);
    outline-offset: 2px;
  }

  /* ── stage (device) ───────────────────────────────────── */
  .stage { display: flex; flex-direction: column; align-items: center }

  .stage-meta {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 16px;
  }

  .step-code {
    font-size: 11.5px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: .03em;
  }

  .state-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 999px;
    transition: background-color .25s ease, color .25s ease;
  }

  .state-chip .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
  }

  .state-chip[data-state="live"] { background: var(--live-soft); color: var(--live) }
  .state-chip[data-state="live"] .dot { background: var(--live) }
  .state-chip[data-state="locked"] { background: var(--locked-soft); color: var(--locked) }
  .state-chip[data-state="locked"] .dot { background: var(--locked) }
  .state-chip[data-state="neutral"] { background: var(--neutral-soft); color: var(--neutral) }
  .state-chip[data-state="neutral"] .dot { background: var(--neutral) }

  .device-row {
    display: flex;
    justify-content: center;
    width: 100%;
  }

  .edge-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 2;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, .94);
    color: var(--ink);
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 3px 10px rgba(20, 22, 28, .1);
  }

  .edge-nav.prev { left: -4px }
  .edge-nav.next { right: -4px }

  .edge-nav:hover { border-color: var(--ink) }
  .edge-nav:active { transform: translateY(-50%) scale(.94) }
  .edge-nav[disabled] { opacity: .28; cursor: default }

  .device {
    position: relative;
    width: clamp(248px, 72vw, 340px);
    touch-action: pan-y;
    padding: 18px 22px;
    border-radius: 28px;
    transition: background-color .3s ease;
  }

  .device[data-state="live"] { background: radial-gradient(circle at 50% 18%, var(--live-soft), transparent 70%) }
  .device[data-state="locked"] { background: radial-gradient(circle at 50% 18%, var(--locked-soft), transparent 70%) }
  .device[data-state="neutral"] { background: radial-gradient(circle at 50% 18%, var(--neutral-soft), transparent 70%) }

  .device-frame {
    width: 100%;
    margin: 0 auto;
    border: 6px solid #1c1d22;
    border-radius: 26px;
    background: #fff;
    overflow: hidden;
    box-shadow: 0 1px 0 rgba(0, 0, 0, .04);
    transition: box-shadow .3s ease;
  }

  .device[data-state="live"] .device-frame { box-shadow: 0 0 0 3px var(--live-soft), 0 0 0 4px color-mix(in srgb, var(--live) 55%, transparent) }
  .device[data-state="locked"] .device-frame { box-shadow: 0 0 0 3px var(--locked-soft), 0 0 0 4px color-mix(in srgb, var(--locked) 55%, transparent) }
  .device[data-state="neutral"] .device-frame { box-shadow: 0 0 0 3px var(--neutral-soft), 0 0 0 4px color-mix(in srgb, var(--neutral) 45%, transparent) }

  .device-frame img {
    display: block;
    width: 100%;
    height: auto;
    pointer-events: none;
    -webkit-user-select: none;
    user-select: none;
    opacity: 1;
    transition: opacity .16s ease;
  }

  .device-frame img.swap { opacity: 0 }

  .scrub {
    display: flex;
    gap: 3px;
    margin-top: 18px;
    width: clamp(248px, 72vw, 340px);
  }

  .tick {
    flex: 1;
    height: 4px;
    border-radius: 2px;
    border: none;
    padding: 0;
    background: var(--line);
    cursor: pointer;
  }

  .tick.active { background: var(--ink) }
  .tick[data-state="live"].active { background: var(--live) }
  .tick[data-state="locked"].active { background: var(--locked) }

  .swipe-hint {
    margin-top: 10px;
    font-size: 10.5px;
    color: var(--sub);
  }

  /* ── caption panel ────────────────────────────────────── */
  .caption-panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 20px;
  }

  .stage-label {
    display: block;
    font-size: 10.5px;
    font-weight: 700;
    color: var(--sub);
    letter-spacing: .04em;
    margin-bottom: 8px;
  }

  .caption-panel h2 {
    font-size: 16px;
    font-weight: 800;
    margin: 0 0 8px;
    letter-spacing: -.01em;
  }

  .caption-panel p {
    font-size: 13.5px;
    color: var(--ink);
    margin: 0;
  }
</style>

<div class="wrap">
  <header class="page-head">
    <span class="eyebrow mono">실기기 캡처 · 14 SCREENS</span>
    <h1>상담사 앱, 그 화면 그대로</h1>
    <p class="lede">전화가 오면 고객 정보가 열리고, 통화가 끝나는 즉시 잠긴다 — 설치부터 상담
      종료까지, 실제 기기에서 찍은 14장으로 그 순간을 그대로 따라간다.</p>
  </header>

  <div class="console">
    <nav class="rail" id="rail" aria-label="단계 이동"></nav>

    <div class="stage">
      <div class="stage-meta">
        <span class="step-code mono" id="stepCode"></span>
        <span class="state-chip" id="stateChip"><span class="dot"></span><span id="stateText"></span></span>
      </div>

      <div class="device-row">
        <div class="device" id="deviceWrap">
          <div class="device-frame"><img id="shot" src="" alt=""></div>
          <button class="edge-nav prev" id="prevBtn" aria-label="이전 화면">‹</button>
          <button class="edge-nav next" id="nextBtn" aria-label="다음 화면">›</button>
        </div>
      </div>

      <div class="scrub" id="scrub" role="group" aria-label="화면 바로가기"></div>
      <div class="swipe-hint mono">← 스와이프 또는 방향키 →</div>
    </div>

    <aside class="caption-panel">
      <span class="stage-label" id="stageLabel"></span>
      <h2 id="shotTitle"></h2>
      <p id="shotDesc"></p>
    </aside>
  </div>
</div>

  var STAGE_META = {
    onboard: { label: '온보딩 권한', state: 'neutral' },
    setup: { label: '상담사 선택', state: 'neutral' },
    call: { label: '전화 수신', state: 'live' },
    detail: { label: '상세 정보', state: 'live' },
    end: { label: '상담 종료', state: 'locked' }
  };

  var STATE_TEXT = {
    neutral: '설정 화면',
    live: '고객 정보 노출 중',
    locked: '고객 정보 잠금'
  };

  var STAGE_ORDER = ['onboard', 'setup', 'call', 'detail', 'end'];

  var idx = 0;
  var assetBase = 'img/';

  var shotEl = document.getElementById('shot');
  var titleEl = document.getElementById('shotTitle');
  var descEl = document.getElementById('shotDesc');
  var stageLabelEl = document.getElementById('stageLabel');
  var stepCodeEl = document.getElementById('stepCode');
  var stateChipEl = document.getElementById('stateChip');
  var stateTextEl = document.getElementById('stateText');
  var deviceWrapEl = document.getElementById('deviceWrap');
  var railEl = document.getElementById('rail');
  var scrubEl = document.getElementById('scrub');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');

  function stageRange(key) {
    var first = -1, last = -1;
    STEPS.forEach(function (s, i) {
      if (s.stage === key) { if (first === -1) first = i; last = i; }
    });
    return first === last ? pad(first + 1) : pad(first + 1) + '–' + pad(last + 1);
  }

  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  function buildRail() {
    railEl.innerHTML = '';
    STAGE_ORDER.forEach(function (key) {
      var meta = STAGE_META[key];
      var b = document.createElement('button');
      b.className = 'rail-item';
      b.type = 'button';
      b.dataset.stage = key;
      b.dataset.state = meta.state;
      b.innerHTML = '<span class="dot"></span><span>' + meta.label + '</span>' +
        '<span class="range mono">' + stageRange(key) + '</span>';
      b.addEventListener('click', function () {
        var firstIdx = STEPS.findIndex(function (s) { return s.stage === key; });
        if (firstIdx >= 0) render(firstIdx);
      });
      railEl.appendChild(b);
    });
  }

  function buildScrub() {
    scrubEl.innerHTML = '';
    STEPS.forEach(function (s, i) {
      var t = document.createElement('button');
      t.className = 'tick';
      t.type = 'button';
      t.dataset.state = STAGE_META[s.stage].state;
      t.setAttribute('aria-label', (i + 1) + ' / ' + STEPS.length);
      t.addEventListener('click', function () { render(i); });
      scrubEl.appendChild(t);
    });
  }

  function render(i) {
    idx = Math.max(0, Math.min(STEPS.length - 1, i));
    var s = STEPS[idx];
    var state = STAGE_META[s.stage].state;

    shotEl.classList.add('swap');
    window.setTimeout(function () {
      shotEl.src = assetBase + s.file;
      shotEl.alt = s.title;
      shotEl.classList.remove('swap');
    }, 90);

    titleEl.textContent = s.title;
    descEl.textContent = s.desc;
    stageLabelEl.textContent = s.stageLabel;
    stepCodeEl.textContent = pad(idx + 1) + ' / ' + pad(STEPS.length);
    stateChipEl.dataset.state = state;
    stateTextEl.textContent = STATE_TEXT[state];
    deviceWrapEl.dataset.state = state;

    prevBtn.toggleAttribute('disabled', idx === 0);
    nextBtn.toggleAttribute('disabled', idx === STEPS.length - 1);

    Array.prototype.forEach.call(scrubEl.children, function (t, i2) {
      t.classList.toggle('active', i2 === idx);
    });
    Array.prototype.forEach.call(railEl.children, function (b) {
      b.classList.toggle('active', b.dataset.stage === s.stage);
    });
  }

  prevBtn.addEventListener('click', function () { render(idx - 1); });
  nextBtn.addEventListener('click', function () { render(idx + 1); });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') render(idx - 1);
    if (e.key === 'ArrowRight') render(idx + 1);
  });

  // swipe (touch + mouse drag)
  (function () {
    var startX = null;
    var dragging = false;

    function start(x) { startX = x; dragging = true; }
    function end(x) {
      if (!dragging || startX === null) return;
      var dx = x - startX;
      if (Math.abs(dx) > 40) {
        if (dx < 0) render(idx + 1); else render(idx - 1);
      }
      dragging = false;
      startX = null;
    }

    deviceWrapEl.addEventListener('touchstart', function (e) {
      start(e.touches[0].clientX);
    }, { passive: true });
    deviceWrapEl.addEventListener('touchend', function (e) {
      end(e.changedTouches[0].clientX);
    });

    deviceWrapEl.addEventListener('mousedown', function (e) {
      start(e.clientX);
      e.preventDefault();
    });
    window.addEventListener('mouseup', function (e) {
      if (dragging) end(e.clientX);
    });
  })();

  buildRail();
  buildScrub();
  render(0);
</script>
